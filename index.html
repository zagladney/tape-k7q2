<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@600;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D9180F; --ink:#17110F; --paper:#FBFAF7; --tan:#DDAA7E; --ember:#EE6A1F;
  --night:#1A0605; --hl:#D8CDB0; --dim:rgba(251,250,247,.62);
  --mono:"IBM Plex Mono",ui-monospace,monospace; --disp:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,serif; --px:"Silkscreen",var(--mono);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--red);color:var(--ink);font-family:var(--mono);overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
canvas{display:block}
#wordgrid,#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#sky{opacity:0;background:var(--night);transition:opacity .9s ease;touch-action:pan-y}
#sky.on{opacity:1}
body.exploring #app{pointer-events:none}
body.exploring #explore .timeline,body.exploring #explore details{pointer-events:auto}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px clamp(18px,5vw,64px) calc(28px + var(--safe-b));pointer-events:none}
#lock>*{pointer-events:auto}
.poster-title{font-family:var(--disp);font-weight:800;letter-spacing:-.045em;line-height:.86;
  font-size:clamp(64px,15vw,190px);margin:0 0 .18em;color:var(--ink);text-shadow:0 0 0 var(--red)}
.poster-meta{font-family:var(--mono);font-weight:500;letter-spacing:.32em;font-size:clamp(12px,1.6vw,17px);line-height:1.55;margin:0}
.poster-meta span{background:var(--red);padding:0 .15em}
#lockform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px 14px;margin-top:22px;max-width:980px;
  background:var(--red);padding:14px 0 0}
#lockform label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.02em}
#lockform input{background:transparent;border:0;border-bottom:2px solid var(--ink);padding:6px 0 7px;font-size:16px;font-family:var(--mono);border-radius:0}
#lockform input::placeholder{color:rgba(23,17,15,.42)}
#lockform input:focus{outline:none;border-bottom-color:var(--paper)}
.btn-px{font-family:var(--px);font-size:14px;background:var(--ink);color:var(--paper);border:0;padding:12px 18px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(23,17,15,.35);align-self:end;white-space:nowrap}
.btn-px:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(23,17,15,.35)}
.btn-px[disabled]{opacity:.6;cursor:progress}
#lockmsg{grid-column:1/-1;font-size:13px;min-height:1.4em;margin:0}
#lockform.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (max-width:720px){#lockform{grid-template-columns:1fr}.btn-px{justify-self:start}}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px clamp(18px,5vw,64px) calc(28px + var(--safe-b))}
body:not(.gated) #gate{display:none}
body.gated{overflow:hidden;height:100svh}
body.gated #lock{visibility:hidden}
#gateform{display:grid;grid-template-columns:minmax(0,340px) auto;gap:10px 14px;margin-top:22px;background:var(--red);padding:14px 0 0;max-width:520px}
#gateform label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.02em}
#gateform input{background:transparent;border:0;border-bottom:2px solid var(--ink);padding:6px 0 7px;font-size:16px;font-family:var(--mono);border-radius:0}
#gateform input:focus{outline:none;border-bottom-color:var(--paper)}
#gatemsg{grid-column:1/-1;font-size:13px;min-height:1.4em;margin:0}
#gateform.shake{animation:shake .35s}
@media (max-width:720px){#gateform{grid-template-columns:1fr}}

/* ---------- app ---------- */
#app{position:relative;z-index:1}
#app[hidden]{display:none}
section{position:relative}

/* cover */
#cover{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:calc(30px + var(--safe-t)) clamp(18px,5vw,64px) 30px}
.case-wrap{flex:1;display:grid;place-items:center;padding:20px 0 10px}
@media (min-width:721px){.case-wrap{place-items:center end;padding-right:max(0px,calc(34vw - min(42vw,280px) - clamp(18px,5vw,64px)))}.case{width:min(42vw,560px)}}
.case{position:relative;width:min(84vw,560px);aspect-ratio:1.56;border:3px solid var(--ink);border-radius:10px;
  background:linear-gradient(rgba(23,17,15,.16),rgba(23,17,15,.16)),linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 39%,rgba(255,255,255,.12) 70%,rgba(255,255,255,.02));
  box-shadow:10px 12px 0 rgba(23,17,15,.28);transform:rotate(-1.2deg)}
.case::before{content:"";position:absolute;left:-3px;top:-3px;bottom:-3px;width:22px;border-radius:8px 0 0 8px;border:3px solid var(--ink);
  background:repeating-linear-gradient(0deg,rgba(23,17,15,.65) 0 2px,transparent 2px 7px),rgba(251,250,247,.15);z-index:3}
.case::after{content:"";position:absolute;inset:0;border-radius:7px;z-index:2;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 75%,rgba(255,255,255,.18));mix-blend-mode:screen}
.paper{position:absolute;left:6%;right:2%;top:-9%;bottom:5%;z-index:1;transform:rotate(2.2deg);filter:drop-shadow(2px 3px 2px rgba(23,17,15,.35))}
.paper svg{width:100%;height:100%;display:block}
.scroll-cue{font-family:var(--mono);font-size:13px;align-self:flex-end;background:var(--red);padding:2px 6px}

/* insert */
#insert{height:260vh;background:linear-gradient(var(--red),var(--ink) 18%)}
#insert .stick{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#deck{width:min(92vw,560px);height:auto;aspect-ratio:120/96;image-rendering:pixelated}
.insert-ui{max-width:520px;text-align:center;color:var(--paper);min-height:150px;transition:opacity .4s}
.insert-ui p{font-family:var(--serif);font-size:17px;line-height:1.45;margin:.4em 0;color:var(--dim)}
.insert-ui a{color:var(--tan)}
#playbtn{font-size:18px;padding:14px 26px;background:var(--red);color:var(--paper);box-shadow:5px 5px 0 #000}
.hint{font-family:var(--mono)!important;font-size:12px!important}

/* tape */
#tape{background:transparent}
.intro{min-height:120vh;display:flex;align-items:center;padding:0 clamp(18px,5vw,64px)}
.song,.flip{min-height:150vh;display:flex;align-items:flex-end;padding:0 clamp(14px,4vw,56px)}
.card{position:sticky;bottom:calc(104px + var(--safe-b));width:min(430px,100%);margin-bottom:104px;color:var(--paper)}
.prose{width:min(520px,100%);color:var(--paper)}
.tracknum{font-family:var(--px);font-size:13px;color:var(--tan);display:flex;gap:14px;align-items:baseline}
.card h2{font-family:var(--disp);font-weight:800;letter-spacing:-.035em;font-size:clamp(30px,5.2vw,48px);line-height:.95;margin:.25em 0 .12em}
.artist{font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:14px}
.hlt{font-family:var(--serif);font-size:clamp(17px,2.1vw,20px);line-height:1.62;margin:0 0 14px}
.hlt span{background:var(--hl);color:var(--ink);padding:.12em .28em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mood{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tan);margin:0 0 16px}
.near{list-style:none;margin:0;padding:0;border-top:1px solid rgba(251,250,247,.22)}
.near li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 0;border-bottom:1px solid rgba(251,250,247,.22);font-size:13px;line-height:1.4}
.near time{font-family:var(--mono);color:var(--tan);white-space:nowrap;font-size:12px;padding-top:1px}
.near span{font-family:var(--serif);font-size:15px;color:var(--paper)}
.near-cap{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);margin:0 0 6px}
.mini-play{margin-top:12px;background:none;border:1px solid rgba(251,250,247,.4);color:var(--paper);font-family:var(--px);font-size:11px;padding:7px 10px;cursor:pointer}
.mini-play:hover{border-color:var(--paper)}
.flip h3,.intro h3,#explore h3{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;font-size:clamp(34px,6vw,64px);line-height:.95;margin:0 0 .35em;color:var(--paper)}
.prose p{font-family:var(--serif);font-size:clamp(17px,2vw,19px);line-height:1.6;color:var(--paper);margin:0 0 .9em}
.prose p.small{font-size:15px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--dim);margin:12px 0}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.ramp{display:inline-block;width:90px;height:8px;vertical-align:middle;margin:0 6px;background:linear-gradient(90deg,#7b1610,#D9180F,#EE6A1F,#DDAA7E,#FBFAF7)}

/* explore */
#explore{min-height:240vh;padding:0 clamp(14px,4vw,56px)}
#explore .panel{position:sticky;top:calc(16px + var(--safe-t));width:min(400px,100%);padding-top:12vh;color:var(--paper);pointer-events:none}
.timeline{margin-top:14px;font-size:12px;color:var(--dim)}
.timeline input{width:100%;accent-color:var(--ember)}
details{margin-top:10px;font-size:13px;color:var(--dim)}
details summary{cursor:pointer;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tan)}
details p{font-family:var(--serif);font-size:15px;line-height:1.55}

/* end */
#end{height:220vh;background:linear-gradient(transparent,#000 35%)}
#end .stick{position:sticky;top:0;height:100svh;display:grid;place-items:center;text-align:center;color:var(--paper)}
#end .fin{opacity:0;transition:opacity 1.6s ease}
#end .fin.show{opacity:1}
#end .fin p{font-family:var(--serif);font-style:italic;font-size:20px;margin:0 0 22px;color:var(--dim)}
#rewind{background:none;border:1px solid rgba(251,250,247,.4);color:var(--paper)}

/* hud */
#hud{position:fixed;top:calc(12px + var(--safe-t));left:12px;z-index:4;display:flex;gap:10px;align-items:center;
  background:rgba(23,17,15,.82);padding:7px 12px 7px 8px;color:var(--paper);opacity:0;pointer-events:none;transition:opacity .5s;max-width:min(360px,calc(100vw - 24px))}
#hud.on{opacity:1}
#mini{width:66px;height:42px;image-rendering:pixelated;flex:none}
#hud .t1{font-family:var(--px);font-size:11px;color:var(--tan)}
#hud .t2{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:8px 10px calc(8px + var(--safe-b));background:#120a09;border-top:1px solid rgba(221,170,126,.25);
  transform:translateY(110%);transition:transform .5s ease}
#dock.on{transform:none}
#dock .inner{max-width:720px;margin:0 auto;min-height:80px}
#dock .fallback{color:var(--paper);font-size:13px;padding:10px 4px;display:none}
#dock .fallback a{color:var(--tan)}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--hl);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.35;
  padding:7px 10px;max-width:250px;opacity:0;transition:opacity .15s}
#tip b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;margin-bottom:2px}
@media (max-width:720px){
  .card{width:100%;bottom:calc(98px + var(--safe-b));margin-bottom:98px;background:linear-gradient(transparent,rgba(26,6,5,.86) 14%);padding-top:22px}
  .near li:nth-child(3){display:none}
  .song,.flip{min-height:135vh}
  #hud .t2{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const C = {red:'#D9180F', ink:'#17110F', paper:'#FBFAF7', tan:'#DDAA7E', ember:'#EE6A1F', night:'#1A0605'};

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const WORDS='REMEMBER KILL OLD LIGHT EYE KNOW SLEEPING IN EVERY AGE CICO BUFF ALL THEY WANTED PET GRIEF ONLY ONE SKIPPING TILES DEMOLITION THE BOY SIDE A B TAPE PLAY REWIND HISS REEL'.split(' ');
const SW=[{bg:C.ink,fg:'#c9b9a6',w:.66},{bg:C.paper,fg:C.ink,w:.1},{bg:C.ember,fg:C.ink,w:.12},{bg:C.tan,fg:C.ink,w:.12}];
function pickSw(r){let x=r(),a=0;for(const s of SW){a+=s.w;if(x<a)return s}return SW[0]}
function inHeart(x,y){const a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}
function drawGrid(){
  const c=$('#wordgrid'),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
  g.fillStyle=C.red;g.fillRect(0,0,W,H);
  const fs=W<700?9.5:10.5,lh=fs*1.62;g.font=`500 ${fs}px "IBM Plex Mono", monospace`;g.textBaseline='alphabetic';
  const r=rng(11),mob=W<720;const hs=Math.min(W*(mob?.38:.25),H*(mob?.2:.25)),hx=W*(mob?.5:.66),hy=H*(mob?.25:.33);
  for(let y=lh;y<H+lh;y+=lh){let x=-r()*30;
    while(x<W){const w=WORDS[(r()*WORDS.length)|0],tw=g.measureText(w).width;
      const nx=(x+tw/2-hx)/hs,ny=-(y-lh*.35-hy)/hs;const ins=inHeart(nx,ny+.1);
      let s=null;if(ins&&r()<.97)s=pickSw(r);else if(!ins&&r()<.018)s=pickSw(r);
      if(s){g.fillStyle=s.bg;g.fillRect(x-2,y-fs-1,tw+4,lh-1);g.fillStyle=s.fg}else g.fillStyle='rgba(70,6,3,.55)';
      g.fillText(w,x,y);x+=tw+5+r()*18}}
}

const b64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9\s,]/g,' ').replace(/\s+/g,' ').trim();
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const p2=n=>String(n).padStart(2,'0');
function dateC(s){s=strip(s);const out=new Set();const nums=(s.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=31);
  let m=-1;for(const t of s.split(/[\s,]+/)){const i=MON.indexOf(t.slice(0,3));if(t.length>=3&&i>=0){m=i+1;break}}
  if(m>0&&nums.length)out.add(p2(m)+'-'+p2(nums[0]));
  if(m<0&&nums.length>=2){const[a,b]=nums;if(a<=12)out.add(p2(a)+'-'+p2(b));if(b<=12)out.add(p2(b)+'-'+p2(a))}
  return[...out]}
function cityC(s){const n=strip(s).replace(/^in /,'');return[...new Set([n.replace(/,/g,'').replace(/\s+/g,' ').trim(),n.split(',')[0].trim(),n.split(/[\s,]/)[0]])].filter(Boolean)}
function bookC(s){let n=strip(s).replace(/,/g,' ').replace(/\s+/g,' ').trim().replace(/^the /,'');return[...new Set([n,n.split(' by ')[0].trim()])].filter(Boolean)}
async function tryKey(pass){
  const te=new TextEncoder(),km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  try{return await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c))}catch(e){return null}}
async function attempt(passes){for(const p of passes){const r=await tryKey(p);if(r)return{r,p}}return null}
let audio=null;
function initAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume()}catch(e){}}
function sfx(kind){if(!audio)return;const t=audio.currentTime,len=kind==='clunk'?.18:.05;
  const b=audio.createBuffer(1,audio.sampleRate*len,audio.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++){const k=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-k,kind==='clunk'?3:6)}
  const src=audio.createBufferSource();src.buffer=b;const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=kind==='clunk'?900:3200;
  const gn=audio.createGain();gn.gain.value=kind==='clunk'?.9:.6;src.connect(f).connect(gn).connect(audio.destination);src.start(t);
  if(kind==='clunk'){const o=audio.createOscillator(),og=audio.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    og.gain.setValueAtTime(.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(og).connect(audio.destination);o.start(t);o.stop(t+.16)}}

  if(!best){tip.style.opacity=0;return}
  if(best.star!==undefined){initAudio();started=true;playTrack(best.star,true);tip.innerHTML=`<b>now playing</b>${T[best.star].title}`}
  else{const p=K.pts[best.pt];tip.innerHTML=`<b>${fmtD.format(toDate(p[3]))} · ${fmtT.format(toDate(p[3])).toLowerCase()}</b>${P.labels[p[6]]} <span style="opacity:.7">(${p[4]} texts)</span>`}
  tip.style.left=Math.min(mx+14,innerWidth-262)+'px';tip.style.top=Math.max(8,my-60)+'px';tip.style.opacity=1;clearTimeout(pick.t);pick.t=setTimeout(()=>tip.style.opacity=0,3200)}

/* ================= scroll orchestration ================= */
function secP(el){const r=el.getBoundingClientRect();return clamp(-r.top/Math.max(1,r.height-innerHeight))}
let last=performance.now(),playBtnBuilt=false;
function setInsertUI(p){
  const ui=$('#insertui');
  if(p<.62){if(ui.dataset.s!=='a'){ui.dataset.s='a';ui.innerHTML='<p>Keep scrolling to put the tape in.</p>'}}
  else if(!started){if(ui.dataset.s!=='b'){ui.dataset.s='b';ui.innerHTML=`<button class="btn-px" id="playbtn">▶ Play</button>
    <p>For whole songs, <a href="https://accounts.spotify.com/login" target="_blank" rel="noopener">log in to Spotify</a> in this browser first. Otherwise each song plays a 30-second preview.</p>
    <p class="hint">If nothing starts, tap ▶ on the player at the bottom.</p>`;
    $('#playbtn').onclick=()=>{initAudio();sfx('click');started=true;ended=false;playTrack(0,true);setInsertUI(1)}}}
  else if(ui.dataset.s!=='c'){ui.dataset.s='c';ui.innerHTML='<p>Rolling. Scroll down.</p>'}
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const vh=innerHeight,mob=innerWidth<720;
  // cover → grid fade
  const ins=$('#insert'),ip=secP(ins);const ir=ins.getBoundingClientRect();
  $('#wordgrid').style.opacity=clamp(ir.top/vh+.4);
  drawDeck(ip);setInsertUI(ip);DG.playPulse+=dt*6;
  const spin=started&&!paused&&!ended;DG.ang+=dt*(spin?6:0);
  // tape section
  const tape=$('#tape').getBoundingClientRect();const inTape=tape.top<vh*.6&&tape.bottom>vh*.4;
  $('#sky').classList.toggle('on',tape.top<vh*.7&&tape.bottom>vh*.2);
  $('#hud').classList.toggle('on',inTape&&started);$('#dock').classList.toggle('on',ir.top<vh*.3&&!ended);
  // active song
  let a=-1;document.querySelectorAll('.song').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<vh*.55&&r.bottom>vh*.55)a=+el.dataset.i});
  const ex=$('#explore').getBoundingClientRect();const inEx=ex.top<vh*.5&&ex.bottom>vh*.5;
  if(mode==='explore'&&!inEx)$('#tip').style.opacity=0;
  mode=inEx?'explore':'tape';document.body.classList.toggle('exploring',inEx);
  if(a!==active){active=a;hiSet=new Set(a>=0?P.nb[a]:[]);if(a>=0&&started&&!ended)playTrack(a)}
  if(active>=0&&mode==='tape'){const s=K.stars[active];tgt.tx=s[0];tgt.ty=s[1];tgt.tz=s[2];tgt.zoom=mob?1.45:1.55}
  else{tgt.tx=0;tgt.ty=0;tgt.tz=0;tgt.zoom=mode==='explore'?(mob?.95:1.08):.9}
  tgt.cx=mob?.5:(mode==='explore'?.64:.66);tgt.cy=mob?(mode==='explore'?.6:.32):.5;
  const k=1-Math.pow(.04,dt);for(const key of['tx','ty','tz','zoom','cx','cy'])cam[key]=lerp(cam[key],tgt[key],k*.9);
  if(!drag&&!RM)cam.yaw+=dt*(mode==='explore'?.05:.09);
  if(mode!=='explore')cam.pitch=lerp(cam.pitch,-.35,k*.5);
  if($('#sky').classList.contains('on'))drawSky();
  if(started)drawMini();
  // end
  const ep=secP($('#end'));
  if(ep>.45&&!ended&&started){ended=true;pauseAll();sfx('click');$('#fin').classList.add('show')}
  if(ep<.2&&ended){ended=false;$('#fin').classList.remove('show')}
  if(ep>.45&&!started)$('#fin').classList.add('show');
  requestAnimationFrame(loop);
}
function rewind(){initAudio();sfx('clunk');ended=false;$('#fin').classList.remove('show');scrollTo({top:0,behavior:RM?'auto':'smooth'});setTimeout(()=>{started=false;cur=-1;active=-1},1500)}
document.fonts&&document.fonts.ready.then(drawGrid);drawGrid();
</script>
